name: Release

# Builds tbl-lead-routing.zip (with a top-level tbl-lead-routing/ folder) and
# attaches it to a GitHub release. The plugin's update checker on each
# WordPress site reads that ZIP as the update, so WordPress shows "Update
# available" in the admin.
#
# Start it either way:
#  - Actions → Release → Run workflow, with the version (e.g. 1.0.1). The
#    vX.Y.Z tag and the release are created from the chosen branch.
#  - Push a vX.Y.Z tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (must match tbl-lead-routing.php)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a version like 1.0.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Verify the version matches the plugin
        run: |
          CONST=$(grep -E "define\( 'TBL_LR_VERSION', '" tbl-lead-routing.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          HEADER=$(grep -E "^ \* Version:" tbl-lead-routing.php | sed -E "s/.*Version:[[:space:]]*([0-9.]+).*/\1/")
          echo "release:        $VERSION"
          echo "TBL_LR_VERSION: $CONST"
          echo "Version header: $HEADER"
          if [ "$VERSION" != "$CONST" ] || [ "$VERSION" != "$HEADER" ]; then
            echo "::error::Release $VERSION must match both TBL_LR_VERSION and the Version header in tbl-lead-routing.php"
            exit 1
          fi

      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build tbl-lead-routing.zip
        run: |
          STAGE=$(mktemp -d)
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='PROJECT.md' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            ./ "$STAGE/tbl-lead-routing/"
          ( cd "$STAGE" && zip -rq "$GITHUB_WORKSPACE/tbl-lead-routing.zip" tbl-lead-routing )
          unzip -l tbl-lead-routing.zip | head -30

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand on GitHub: just attach the ZIP.
            gh release upload "$TAG" tbl-lead-routing.zip --clobber
          else
            gh release create "$TAG" tbl-lead-routing.zip \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
